services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: manualmind
      POSTGRES_PASSWORD: manualmind
      POSTGRES_DB: manualmind
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manualmind -d manualmind"]
      interval: 5s
      timeout: 5s
      retries: 20

  mcp:
    build:
      context: .
      dockerfile: mcp_servers/Dockerfile
    environment:
      MCP_PORT: "8092"
    ports:
      - "8092:8092"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://manualmind:manualmind@postgres:5432/manualmind
      DB_SSLMODE: prefer
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_FALLBACK_MODEL: ${OPENAI_FALLBACK_MODEL:-gpt-4o-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      MCP_SERVER_URL: http://mcp:8092/mcp
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:4178,http://localhost:4178
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-change-me}
      SEED_DEMO_DATA: "true"
      EMBED_WORKER: "false"
      AUTO_MIGRATE: "true"
      STORAGE_LOCAL_PATH: /data
    volumes:
      - uploads:/data
    ports:
      - "8091:8091"
    depends_on:
      postgres:
        condition: service_healthy
      mcp:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.worker"]
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://manualmind:manualmind@postgres:5432/manualmind
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      STORAGE_LOCAL_PATH: /data
      SEED_DEMO_DATA: "false"
    volumes:
      - uploads:/data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
