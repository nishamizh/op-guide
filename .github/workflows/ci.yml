name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: manualmind
          POSTGRES_PASSWORD: manualmind
          POSTGRES_DB: manualmind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U manualmind -d manualmind_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend
        run: python -m pip install -r backend/requirements.txt
      - name: Ruff
        working-directory: backend
        run: ruff check app tests
      - name: Pytest
        working-directory: backend
        run: python -m pytest -q
      - name: Evaluation smoke
        working-directory: backend
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+psycopg://manualmind:manualmind@127.0.0.1:5432/manualmind_test
          STORAGE_LOCAL_PATH: /tmp/manualmind-test-storage
          OPENAI_API_KEY: ""
          LLM_ANSWERS: "false"
          SESSION_SECRET: test-session-secret
          MCP_SERVER_URL: http://127.0.0.1:8097/mcp
          MCP_PORT: "8097"
        run: |
          PYTHONPATH="${{ github.workspace }}/mcp_servers" python -m manufacturer > /tmp/mcp.log 2>&1 &
          echo $! > /tmp/mcp.pid
          for _ in $(seq 1 50); do
            python -c "import socket; socket.create_connection(('127.0.0.1', 8097), 1).close()" && break
            sleep 0.2
          done
          python -m app.evals --cases e104-meaning,missing-zephyr,unsafe-bypass --fail-on-unsafe
          kill "$(cat /tmp/mcp.pid)" || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://api.example.com
