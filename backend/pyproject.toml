[project]
name = "manualmind"
version = "1.0.0"
description = "Industrial manual assistant with hybrid retrieval, LangGraph, and read-only manufacturer MCP tools."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3.6",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.18",
  "openai>=1.55",
  "langgraph>=0.2.60",
  "langgraph-checkpoint-postgres>=2.0",
  "mcp>=1.2",
  "pypdf>=5.1",
  "python-docx>=1.1",
  "tiktoken>=0.8",
  "boto3>=1.35",
  "httpx>=0.28",
  "fpdf2>=2.8",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[tool.pytest.ini_options]
pythonpath = [".", "../mcp_servers"]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/seed/content.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"
